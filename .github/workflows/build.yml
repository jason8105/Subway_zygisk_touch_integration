name: Build ImGui Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.18.1'

      - name: Build Mod Menu
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease

      - name: Debug and Locate Build Output
        run: |
          echo "=== SEARCHING FOR ALL ZIP FILES IN REPO ==="
          find . -name "*.zip"
          echo "=== CHECKING OUT FOLDER CONTENTS ==="
          ls -la out/ || echo "out folder not found"
          echo "=== CHECKING MODULE BUILD FOLDER ==="
          find module/build -name "*.zip" || echo "no zip in module/build"

      - name: Locate and Move Build Output
        run: |
          mkdir -p final_output
          find . -name "*.zip" -exec cp {} final_output/ \;
          ls -la final_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subway-ImGui-Menu-Release
          path: final_output/*.zip
